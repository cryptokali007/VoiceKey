name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows x64 application
        shell: cmd
        run: build.cmd
      - name: Check WAV output and transcribe a real speech clip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'voicekey-jfk.wav'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.2/samples/jfk.wav' -OutFile $fixture
          $p = Start-Process ./dist/VoiceKey.exe -ArgumentList @('--self-test', ('"' + $fixture + '"')) -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "VoiceKey self-test failed with exit code $($p.ExitCode)" }
      - name: Test floating input and automatic paste on the Windows desktop
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $smoke = Join-Path $env:RUNNER_TEMP 'VoiceKeyDesktopSmoke.exe'
          & $compiler /nologo /target:exe /platform:x64 /codepage:65001 "/out:$smoke" /main:VoiceKey.DesktopSmoke /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Net.Http.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll 'src\*.cs' 'tests\DesktopSmoke.cs'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop test did not compile.' }
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop input check returned $LASTEXITCODE." }
      - name: Package public download
        shell: pwsh
        run: |
          Copy-Item Install.cmd, README.md, LICENSE -Destination dist
          Compress-Archive -Path dist/* -DestinationPath VoiceKey-Windows-x64.zip
          $h=(Get-FileHash VoiceKey-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  VoiceKey-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            VoiceKey-Windows-x64.zip
            SHA256SUMS.txt
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
      - name: Publish versioned Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "VoiceKey $version for Windows" --notes-file RELEASE_NOTES.md VoiceKey-Windows-x64.zip SHA256SUMS.txt
      - name: Verify account-free download
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          mkdir anonymous-download
          cd anonymous-download
          for asset in VoiceKey-Windows-x64.zip SHA256SUMS.txt; do
            curl --disable --fail --silent --show-error --location --retry 4 --retry-all-errors "$base/$asset" --output "$asset"
          done
          sha256sum --check SHA256SUMS.txt
          unzip -t VoiceKey-Windows-x64.zip
          unzip -Z1 VoiceKey-Windows-x64.zip | grep -Fx 'VoiceKey.exe'
          unzip -Z1 VoiceKey-Windows-x64.zip | grep -Fx 'Install.cmd'
